# Simstack4 Configuration File
# This replaces the INI format from simstack3 with more user-friendly TOML

[binning]
stack_all_z_at_once = true    # Stack all redshifts together (optimal but memory intensive)
add_foreground = true         # Add foreground layer of all 1's
crop_circles = true           # Draw circles around sources and flatten

[error_estimator]
write_simmaps = false         # Write simulated images at each wavelength
randomize = false             # For null-testing: shuffle (x,y) when building layers

[error_estimator.bootstrap]
enabled = true                # Use bootstrap method for error estimation
method="per_bin"             # "per_bin"
iterations = 5            # Number of bootstrap iterations
initial_seed = 1              # Seed for random shuffling (ensures consistency across bands)
split_fraction = 0.5

# Top-level simple settings
cosmology = "Planck18"        # Options: "Planck15", "Planck18"

[output]
folder = "$PICKLESPATH/simstack/stacked_flux_densities"  # Environment variables supported
shortname = "cosmos20"      # Name for output folder

[catalog]
path = "$CATSPATH/cosmos"     # Path to catalog directory
file = "cosmos2020_FARMER.csv"  # Catalog filename

[catalog.astrometry]
ra = "ALPHA_J2000"                     # Column name for right ascension
dec = "DELTA_J2000"                   # Column name for declination

[catalog.classification]
split_type = "nuvrj"            # Options: "labels", "uvj", "nuvrj"
bin_property_columns = ["lp_mass_med", "lp_SFR_med", "lp_sSFR_med"]

[catalog.classification.split_params.bins]
"NUV-R" = "restNUV-R"              # NUV-R color column name
"R-J" = "restR-J"                  # R-J color column name

[catalog.classification.binning.redshift]
id = "lp_zBEST"                 # Column name for redshift
label = "Redshift"
# NON-DITHERED, GRADED-RESOLUTION scheme 2026-07-23 — z = 0.20-6.00, ONE bin set for all 3 folds.
#  Dithering dropped: oversampling is information-NEUTRAL (CRLB test) and the footprints are
#  smooth, so the staggered sub-bin sampling added nothing. Instead all 3 k-folds stack on the
#  SAME bins -> every z-point pools 3x the sources (higher per-bin S/N -> tier promotion), and
#  the fold scatter is a clean per-bin jackknife error (keeps cosmic variance; avoids the
#  ill-conditioned formal covariance). K-fold kept purely as the error engine.
#  Bin widths GRADED to the footprint Nyquist (FWHM/2, which GROWS with z) and to S/N (low-z
#  bright, high-z faint) -- both want fine-low-z / coarse-high-z:
#    z 0.2-1.0 : dz=0.20  (narrowest footprints: 16.4/17 @z~0.4, 11.3+12.7 @z~0.9; low-z anchor)
#    z 1.0-2.0 : dz=0.25  (7.7+8.6 reference @z~1.9; cosmic-noon crossing)
#    z 2.0-3.5 : dz=0.35-0.40  (6.2 @z~3; getting faint)
#    z 3.5-6.0 : dz=0.70-1.0   (faint continuum/hot anchors; 12.7/11.3-in-70 crossings @z~4.5/5.2)
#  Workflow: keep these bins FIXED; swap ONLY catalog.file across split{0,1,2}of3.parquet;
#  stack 3x. No z-edge stagger. Compare vs cosmos20_PAH_dithered (dz=0.15) and _wide (dz=0.30).
#bins = [0.20, 0.40, 0.60, 0.80, 1.00, 1.25, 1.50, 1.75, 2.00, 2.35, 2.70, 3.10, 3.50,
#        4.20, 5.00, 6.00]
bins = [0.2, 0.35, 0.5, 0.65, 0.8, 0.95, 1.1, 1.25, 1.4,
        1.6, 1.8, 2.0, 2.2, 2.4, 2.6,
        2.9, 3.2, 3.5,
        4.2, 5.0, 6.0]

[catalog.classification.binning.stellar_mass]
id = "lp_mass_med"                  # Column name for stellar mass
bins = [9.0, 9.9, 10.6, 10.8, 11.0, 11.5]

# Map configurations - each section defines a new map
[maps.mips_24]
wavelength = 24.0             # Wavelength in microns
color_correction = 1.24       # Color correction factor
path_map = "$MAPSPATH/cosmos/cutouts/mips_24_GO3_sci_10.cutout.fits"
path_noise = "$MAPSPATH/cosmos/cutouts/mips_24_GO3_unc_10.cutout.fits"

[maps.mips_24.beam]
fwhm = 5.51                   # FWHM in arcsec
area_sr = 1.328e-09          # Solid angle (1.0 if already in Jy/beam)

[maps.mips_70]
wavelength = 70.0             # Wavelength in microns
color_correction = 1.33       # Color correction factor
path_map = "$MAPSPATH/cosmos/mips/scosmos_mips_70_sci_v3.fits"
path_noise = "$MAPSPATH/cosmos/mips/scosmos_mips_70_unc_v3.fits"

[maps.mips_70.beam]
fwhm = 18.0                   # FWHM in arcsec
area_sr = 1.296e-08          # Solid angle (1.0 if already in Jy/beam)

[maps.pacs_green]
